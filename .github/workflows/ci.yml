name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # A diferencia de mto-configuration y mto-stock, aqui no hace falta Docker: el servicio de
      # destino de las pruebas de enrutado es el HttpServer del propio JDK, en loopback.
      - name: Build and run the test suite
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish image to GHCR
    needs: test
    # Solo desde master. Una rama de trabajo no debe publicar una imagen que alguien pueda
    # desplegar por error, y un pull_request desde un fork no tendria permiso para hacerlo.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lo que permite empujar a ghcr.io con el GITHUB_TOKEN, sin ningun secreto que mantener.
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La cache de Actions evita repetir la descarga entera de dependencias de Maven en cada
          # push; el Dockerfile ya la aprovecha con su mount de /root/.m2.
          cache-from: type=gha
          cache-to: type=gha,mode=max
